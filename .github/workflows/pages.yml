name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Deploy when content, translations, layouts, assets or config change; docs-only pushes do not deploy.
    paths:
      - 'content/**'
      - 'i18n/**'
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - 'hugo.toml'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.8'
          extended: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build site with Hugo
        run: npm run build
      # Checks public/ from the build step (npm test would build again).
      - name: Test site
        run: node --test tests/site.test.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
