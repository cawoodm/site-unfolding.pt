<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unfolding Portugal</title>
  <script>
    // Go to the first browser language the site offers, otherwise to the default language.
    const supported = [{{ range $i, $l := site.Languages }}{{ if $i }}, {{ end }}"{{ $l.Lang }}"{{ end }}];
    const preferred = (navigator.languages || [navigator.language || ''])
      .map((lang) => lang.toLowerCase().slice(0, 2))
      .find((lang) => supported.includes(lang));
    location.replace((preferred || '{{ site.Language.Lang }}') + '/');
  </script>
  <noscript><meta http-equiv="refresh" content="0; url={{ site.Language.Lang }}/"></noscript>
  {{- range site.Languages }}
  <link rel="alternate" hreflang="{{ .Lang }}" href="{{ printf "%s/" .Lang | absURL }}">
  {{- end }}
  <link rel="alternate" hreflang="x-default" href="{{ printf "%s/" site.Language.Lang | absURL }}">
</head>
<body>
  <h1>unfolding.pt</h1>
  <p>{{ range $i, $l := site.Languages }}{{ if $i }} | {{ end }}<a href="{{ $l.Lang }}/">{{ $l.LanguageName }}</a>{{ end }}</p>
</body>
</html>
