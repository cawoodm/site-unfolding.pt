<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unfolding Portugal</title>
  <script>
    // Go to German if the browser ranks German above English, otherwise to English.
    const preferred = (navigator.languages || [navigator.language || ''])
      .map((lang) => lang.toLowerCase().slice(0, 2))
      .find((lang) => lang === 'de' || lang === 'en');
    location.replace(preferred === 'de' ? 'de/' : 'en/');
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
  <link rel="alternate" hreflang="en" href="https://unfolding.pt/en/">
  <link rel="alternate" hreflang="de" href="https://unfolding.pt/de/">
  <link rel="alternate" hreflang="x-default" href="https://unfolding.pt/en/">
  <link rel="icon" type="image/webp" href="images/favicon.webp">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="flex min-h-screen items-center justify-center p-4 text-center">
  <main>
    <h1 class="mb-8 text-5xl font-bold">unfolding.pt</h1>
    <p class="flex justify-center gap-8 text-xl">
      <a href="en/" class="text-secondary underline underline-offset-4 hover:text-primary">English</a>
      <a href="de/" class="text-secondary underline underline-offset-4 hover:text-primary">Deutsch</a>
    </p>
  </main>
</body>
</html>
